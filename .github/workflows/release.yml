name: release

# v0.2.0 のようなタグを push すると、インストーラーを GitHub Releases に公開する。
# アプリは起動時に最新の Release を見て、新しければ更新ボタンを出す。
# タグの数字は tauri.conf.json と package.json の version にそろえること。
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: npm ci
      - run: npm test
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: VOICEPEAK 編集ソフト ${{ github.ref_name }}
          releaseBody: 下の「…-setup.exe」をダウンロードして実行してください。インストール済みの場合も、新しいインストーラーを実行すれば上書きで更新されます。
          releaseDraft: false
          prerelease: false
